name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Pomodoro.csproj -c Release

      - name: Test
        run: dotnet run -c Release --project engine-tests/EngineTests.csproj

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro
          path: |
            bin/Release/net48/Pomodoro.exe
            bin/Release/net48/Pomodoro.exe.config

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/net48/Pomodoro.exe
            bin/Release/net48/Pomodoro.exe.config
